name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: unzip -q voiddls_26_2_automine.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        working-directory: friendutil
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: voiddls-jar
          path: |
            friendutil/build/libs/*.jar
            !friendutil/build/libs/*-sources.jar
